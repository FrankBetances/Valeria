; Lúa · banco de pruebas de la Fase 0
;
;   pio run -t upload -t monitor
;
; La placa es una ESP32-C3 con display GC9A01 (ESP32-2424S012). El perfil
; `esp32-c3-devkitm-1` vale para flashear; lo que hay que confirmar antes de
; medir nada son los PINES (ver include/board.h).
[env:lua]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    moononournation/GFX Library for Arduino@^1.4.9

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
