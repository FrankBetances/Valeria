name: Deploy Legal Site (GitHub Pages)

# Publica ÚNICAMENTE el contenido de `site/` en GitHub Pages. El resto del
# repositorio (código, docs internas de planificación, corpus de voz) NO se
# publica: el artefacto se construye a partir de esa carpeta y de nada más.
#
# URL resultante: https://frankbetances.github.io/Valeria/
# Política de privacidad para la ficha de Play Store:
#   https://frankbetances.github.io/Valeria/privacidad.html
#
# Requisito de una sola vez en el repositorio:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# No se puede automatizar: `configure-pages` acepta `enablement: true`, pero el
# GITHUB_TOKEN de Actions no puede DAR DE ALTA el sitio de Pages —crearlo exige
# permisos de administración del repositorio que el token no lleva— y la acción
# falla con "Create Pages site failed: Resource not accessible by integration".
# Comprobado en el run #2 de este workflow. Con `pages: write` basta para
# publicar en un sitio que ya existe, que es lo que hace este job.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Permite publicar a mano desde la pestaña Actions (útil la primera vez).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Subir la carpeta site/ como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
