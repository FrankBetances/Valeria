name: Deploy Legal Site (GitHub Pages)

# Publica ÚNICAMENTE el contenido de `site/` en GitHub Pages. El resto del
# repositorio (código, docs internas de planificación, corpus de voz) NO se
# publica: el artefacto se construye a partir de esa carpeta y de nada más.
#
# URL resultante: https://frankbetances.github.io/Valeria/
# Política de privacidad para la ficha de Play Store:
#   https://frankbetances.github.io/Valeria/privacidad.html
#
# Requisito de una sola vez en el repositorio, YA APLICADO:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Si alguna vez vuelve a "Deploy from a branch", este job falla ANTES de
# arrancar —sin runner, sin pasos y sin logs, en un par de segundos— porque el
# entorno `github-pages` queda en manos del constructor legacy de Jekyll. Ese
# fallo mudo es la firma de que la fuente no es "GitHub Actions".
#
# No se puede automatizar: `configure-pages` acepta `enablement: true`, pero el
# GITHUB_TOKEN de Actions no puede DAR DE ALTA el sitio de Pages —crearlo exige
# permisos de administración del repositorio que el token no lleva— y la acción
# falla con "Create Pages site failed: Resource not accessible by integration".
# Comprobado en el run #2 de este workflow. Con `pages: write` basta para
# publicar en un sitio que ya existe, que es lo que hace este job.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Permite publicar a mano desde la pestaña Actions (útil la primera vez).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Subir la carpeta site/ como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Un deploy en verde NO demuestra que el sitio se sirva. El 19/8/2026
      # Google rechazó la ficha por 404 en privacidad.html con este workflow en
      # verde desde el 4/8: Pages estaba sin publicar y el run no se enteró.
      # Desde aquí, "verde" significa que las tres URLs responden de verdad.
      - name: Comprobar que las tres URLs legales se sirven
        run: |
          for intento in 1 2 3 4 5; do
            if node scripts/check-legal-urls.js; then
              exit 0
            fi
            echo "Intento $intento fallido; Pages puede tardar en propagar. Reintento en 15 s."
            sleep 15
          done
          echo "::error::El despliegue terminó en verde pero las URLs legales no se sirven."
          exit 1
