name: Generate Voice Assets

# Tubería de Fase 2 del plan ILENIA/Nós: sintetiza el corpus de voz con la voz
# neuronal configurada (scripts/generate-voice-assets.py), masteriza, regenera
# el mapa valeriaVoiceAssets.ts y COMMITEA los assets a la rama desde la que
# se lanzó. Se ejecuta a mano (workflow_dispatch) cuando cambia el corpus o la
# voz; el push resultante dispara el build Android normal, que empaqueta el
# audio en el APK. Los modelos solo corren aquí: jamás en el dispositivo.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Idioma del corpus a sintetizar (es · gl · eu · en · ca)'
        required: false
        default: 'es'
      force:
        description: 'Forzar regeneración completa aunque existan los .m4a'
        type: boolean
        required: false
        default: false
  # Disparo automático cuando cambia la propia tubería o el corpus en ramas de
  # trabajo (la integración de esta sesión no puede lanzar workflow_dispatch).
  push:
    # Solo ramas de trabajo: main está protegida (PR + status check "build"), así
    # que el bot NO puede commitear los assets ahí. La síntesis corre en una rama
    # claude/** y los assets se integran a main por PR o push de admin.
    branches:
      - claude/**
    paths:
      - voice-corpus.json
      - scripts/generate-voice-assets.py
      - scripts/build-voice-asset-map.js
      - scripts/export-voice-corpus.js
      - .github/workflows/voice-assets.yml

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    # Anti-bucle: el commit de assets que hace este workflow también toca
    # voice-corpus.json; no debe relanzarse a sí mismo.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export voice corpus
        run: node scripts/export-voice-corpus.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install piper-tts
        run: pip install piper-tts==1.8.0 onnxruntime==1.32.0 huggingface-hub==0.36.0

      # Las imágenes actuales de ubuntu-latest ya no traen ffmpeg de serie.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Incremental (salvo --force o cambio de paramsHash): cada idioma sintetiza lo pendiente.
      - name: Synthesize es (Sharvard · piper)
        run: python3 scripts/generate-voice-assets.py --lang es --workers 4 ${{ inputs.force && '--force' || '' }}

      # Inglés de EE. UU. (plan en-US, EN-4.2): mismo motor `piper` que Sharvard.
      - name: Synthesize en (LJSpeech · piper)
        run: python3 scripts/generate-voice-assets.py --lang en --workers 4 ${{ inputs.force && '--force' || '' }}

      # coqui-tts (torch CPU, ~2 GB) solo se instala si faltan assets gl o cambió paramsHash.
      - name: Check missing gl assets
        id: glcheck
        run: |
          MISSING=$(python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import importlib.util
          spec = importlib.util.spec_from_file_location("gva", "scripts/generate-voice-assets.py")
          gva = importlib.util.module_from_spec(spec); spec.loader.exec_module(gva)
          h = gva.compute_params_hash(gva.VOICES['gl'], 'gl')
          corpus = json.load(open('voice-corpus.json'))['corpus']
          mpath = pathlib.Path('voice-assets-manifest.gl.json')
          old = {f['id']: f for f in (json.loads(mpath.read_text()).get('files', []) if mpath.exists() else [])}
          out = pathlib.Path('assets/voice')
          force = "${{ inputs.force }}" == "true"
          print(sum(1 for e in corpus if e.get('lang') == 'gl' and (
              force or not (out / f"{e['id']}.m4a").exists()
              or (old.get(e['id']) or {}).get('paramsHash') != h
              or (old.get(e['id']) or {}).get('lufs') is None
              or (old.get(e['id']) or {}).get('limiterGainReductionDb') is None
              or (old.get(e['id']) or {}).get('compressorGainReductionDb') is None
              or (old.get(e['id']) or {}).get('normType') != 'linear'
          )))
          PY
          )
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "Locuciones gl pendientes: $MISSING"

      - name: Install coqui-tts (Celtia)
        if: steps.glcheck.outputs.missing != '0'
        run: |
          pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "coqui-tts[codec]==0.28.0" six transformers==4.57.6 huggingface-hub==0.36.0

      - name: Synthesize gl (Celtia · Proxecto Nós)
        if: steps.glcheck.outputs.missing != '0'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/generate-voice-assets.py --lang gl --workers 4 ${{ inputs.force && '--force' || '' }}

      # euskera (HiTZ-TTS · ILENIA/NEL-GAITU)
      - name: Check missing eu assets
        id: eucheck
        run: |
          MISSING=$(python3 - <<'PY'
          import json, pathlib, importlib.util
          spec = importlib.util.spec_from_file_location("gva", "scripts/generate-voice-assets.py")
          gva = importlib.util.module_from_spec(spec); spec.loader.exec_module(gva)
          h = gva.compute_params_hash(gva.VOICES['eu'], 'eu')
          corpus = json.load(open('voice-corpus.json'))['corpus']
          mpath = pathlib.Path('voice-assets-manifest.eu.json')
          old = {f['id']: f for f in (json.loads(mpath.read_text()).get('files', []) if mpath.exists() else [])}
          out = pathlib.Path('assets/voice')
          force = "${{ inputs.force }}" == "true"
          print(sum(1 for e in corpus if e.get('lang') == 'eu' and (
              force or not (out / f"{e['id']}.m4a").exists()
              or (old.get(e['id']) or {}).get('paramsHash') != h
              or (old.get(e['id']) or {}).get('lufs') is None
              or (old.get(e['id']) or {}).get('limiterGainReductionDb') is None
              or (old.get(e['id']) or {}).get('compressorGainReductionDb') is None
              or (old.get(e['id']) or {}).get('normType') != 'linear'
          )))
          PY
          )
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "Locuciones eu pendientes: $MISSING"

      - name: Set up AhoTTS (HiTZ euskera)
        if: steps.eucheck.outputs.missing != '0'
        run: |
          git clone https://github.com/hitz-zentroa/aHoTTS.git "$RUNNER_TEMP/ahotts"
          git -C "$RUNNER_TEMP/ahotts" checkout db56c5dd27a692b76cd23f7d784c9c465f6a9a18
          chmod +x "$RUNNER_TEMP/ahotts/ahotts/tts" || true
          pip install huggingface-hub==0.36.0
          echo "AHOTTS_DIR=$RUNNER_TEMP/ahotts" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ahotts" >> "$GITHUB_ENV"

      - name: Synthesize eu (AhoTTS · HiTZ/Aholab)
        if: steps.eucheck.outputs.missing != '0'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/generate-voice-assets.py --lang eu --workers 4 ${{ inputs.force && '--force' || '' }}

      # català (Matxa-TTS · projecte AINA)
      - name: Check missing ca assets
        id: cacheck
        run: |
          MISSING=$(python3 - <<'PY'
          import json, pathlib, importlib.util
          spec = importlib.util.spec_from_file_location("gva", "scripts/generate-voice-assets.py")
          gva = importlib.util.module_from_spec(spec); spec.loader.exec_module(gva)
          h = gva.compute_params_hash(gva.VOICES['ca'], 'ca')
          corpus = json.load(open('voice-corpus.json'))['corpus']
          mpath = pathlib.Path('voice-assets-manifest.ca.json')
          old = {f['id']: f for f in (json.loads(mpath.read_text()).get('files', []) if mpath.exists() else [])}
          out = pathlib.Path('assets/voice')
          force = "${{ inputs.force }}" == "true"
          print(sum(1 for e in corpus if e.get('lang') == 'ca' and (
              force or not (out / f"{e['id']}.m4a").exists()
              or (old.get(e['id']) or {}).get('paramsHash') != h
              or (old.get(e['id']) or {}).get('lufs') is None
              or (old.get(e['id']) or {}).get('limiterGainReductionDb') is None
              or (old.get(e['id']) or {}).get('compressorGainReductionDb') is None
              or (old.get(e['id']) or {}).get('normType') != 'linear'
          )))
          PY
          )
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "Locuciones ca pendientes: $MISSING"

      - name: Set up Matxa-TTS (AINA català)
        if: steps.cacheck.outputs.missing != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          pip install onnxruntime==1.32.0 phonemizer==3.6.0 numpy

      - name: Synthesize ca (Matxa-TTS · projecte AINA)
        if: steps.cacheck.outputs.missing != '0'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/generate-voice-assets.py --lang ca --workers 4 ${{ inputs.force && '--force' || '' }}

      - name: Upload Matxa samples (para elegir el acento de oído)
        if: always() && steps.cacheck.outputs.missing != '0'
        uses: actions/upload-artifact@v4
        with:
          name: matxa-muestras-acentos
          path: scripts/.voices/matxa/muestras/
          if-no-files-found: warn

      - name: Rebuild asset map
        run: node scripts/build-voice-asset-map.js

      - name: Cobertura del corpus tras la síntesis (informativo)
        continue-on-error: true
        run: node scripts/check-voice-corpus-coverage.js

      # POR QUÉ ESTE PASO: los pasos de síntesis son continue-on-error (si una
      # voz falla, el resto del lote debe publicarse igual), así que el run sale
      # VERDE aunque no se haya generado ni una locución. Eso ya confundió una
      # vez: el run 50 salió en verde con cero assets catalanes porque el canario
      # de Matxa había abortado. Un resumen en la portada del run quita esa
      # ambigüedad: dice, por idioma, cuántas locuciones tienen audio y cuántas
      # no, para que «verde» no se lea como «hecho».
      - name: Resumen del lote (qué se generó de verdad)
        if: always()
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const corpus = JSON.parse(fs.readFileSync('voice-corpus.json', 'utf8')).corpus;
          const have = new Set(fs.existsSync('assets/voice')
            ? fs.readdirSync('assets/voice').filter((f) => f.endsWith('.m4a')) : []);
          const by = {};
          for (const e of corpus) {
            const l = e.lang || 'es';
            by[l] ??= { total: 0, con: 0 };
            by[l].total++;
            if (have.has(`${e.id}.m4a`)) by[l].con++;
          }
          console.log('## Locuciones con audio tras este lote\n');
          console.log('| Idioma | Con audio | Sin audio | Estado |');
          console.log('|---|---:|---:|---|');
          let incompleto = [];
          for (const [l, v] of Object.entries(by).sort()) {
            const falta = v.total - v.con;
            // es-DO no pregenera: suena con la voz del sistema, no cuenta.
            const estado = falta === 0 ? '✅ completo'
              : v.con === 0 ? '❌ **no se generó ninguna**'
                : '⚠️ incompleto';
            if (falta > 0) incompleto.push(`${l} (${falta})`);
            console.log(`| \`${l}\` | ${v.con} | ${falta} | ${estado} |`);
          }
          console.log('');
          console.log(incompleto.length
            ? `> **Sin audio completo:** ${incompleto.join(' · ')}. `
              + 'Revisa el log del paso de síntesis correspondiente: los pasos son '
              + '`continue-on-error`, así que el run sale verde igualmente.'
            : '> Todas las variedades con banco pregenerado están completas.');
          JS

      - name: Commit assets to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voice src/valeriaVoiceAssets.ts voice-corpus.json voice-assets-manifest.*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los assets de voz."
            exit 0
          fi
          git commit \
            -m "Voz ILENIA/Nós · Fase 2: assets de voz neuronal generados en CI" \
            -m "Lote sintetizado por el workflow voice-assets (ver voice-assets-manifest.json: voz, duración y peso por locución). Mapa valeriaVoiceAssets.ts regenerado."
          # Empuje robusto ante pushes concurrentes: si la rama avanzó mientras
          # sintetizábamos, rebasar (los assets son ficheros nuevos, sin conflicto)
          # y reintentar. Evita el "! [rejected] (fetch first)" que perdía el lote.
          for i in 1 2 3; do
            git push && break
            echo "push rechazado (intento $i); rebase y reintento…"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done

      - name: Comprobar calidad de audio (LUFS, normType, GR<=3dB y paramsHash)
        run: node scripts/check-voice-assets-quality.js
