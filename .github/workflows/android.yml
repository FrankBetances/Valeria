name: Android Build

# Firma de release: requiere estos secrets en Settings > Secrets and variables > Actions:
#   ANDROID_RELEASE_KEYSTORE_BASE64  → keystore codificado (base64 -w0 release.keystore)
#   ANDROID_RELEASE_STORE_PASSWORD   → contraseña del keystore
#   ANDROID_RELEASE_KEY_ALIAS        → alias de la clave
#   ANDROID_RELEASE_KEY_PASSWORD     → contraseña de la clave
# Con los secrets configurados, cada push/fusión a main genera el APK y el AAB
# (Android App Bundle) firmados; en el resto de ramas solo se compila el APK.
#
# Config de Firebase: la app lee variables EXPO_PUBLIC_FIREBASE_* en tiempo de
# build (Metro las inyecta al empaquetar el JS durante el build de Gradle).
# Añade también estos secrets para que los builds de CI salgan con Firebase
# configurado (sin ellos la app compila igual, pero avisa de config incompleta):
#   EXPO_PUBLIC_FIREBASE_API_KEY  → apiKey del SDK web (apps:sdkconfig)
#   EXPO_PUBLIC_FIREBASE_APP_ID   → appId de la app Android (apps:sdkconfig)

on:
  push:
    branches:
      - main
      - claude/**
    # El sitio legal (`site/`) y su workflow no entran en el APK: compilarlo
    # por un cambio de la política de privacidad quema minutos de CI y deja
    # ruido rojo/verde sin relación con la app.
    #
    # La documentación tampoco entra en el APK, y sale caro: cada build son ~13
    # min de runner y 131 MB de artefacto. Un retoque del README (100 KB, se
    # edita en casi cada sesión) no cambia un solo byte del binario.
    # OJO con lo que NO se puede ignorar aquí: `docs/lua-mascota.png` es entrada
    # del gate de marca (check-brand-consistency.js compara su hash con el del
    # icono). Por eso se ignoran extensiones concretas de `docs/`, nunca
    # `docs/**` entero.
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cleanup-actions-storage.yml'
      - 'README.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**.md'
      - 'docs/**.pdf'
      - 'docs/**.docx'
      - 'docs/**.html'
      - 'docs/screenshots/**'
  pull_request:
    branches:
      - main
      - claude/**
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cleanup-actions-storage.yml'
      - 'README.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**.md'
      - 'docs/**.pdf'
      - 'docs/**.docx'
      - 'docs/**.html'
      - 'docs/screenshots/**'
  # Relanzo tras la síntesis de voz. El APK debe empaquetar los assets de voz
  # neuronal del corpus que compila, y "Generate Voice Assets" los sintetiza y
  # los COMMITEA a la rama en paralelo a este build. Ese commit lo hace el
  # GITHUB_TOKEN y, por política de GitHub (anti-bucle), un push del token NO
  # dispara workflows: sin este `workflow_run` el build que corrió antes de la
  # síntesis se quedaba en rojo para siempre, sin forma de recuperarse solo.
  # OJO: `workflow_run` solo surte efecto con el fichero ya en la rama por
  # defecto; en una rama de trabajo no se activa hasta fusionar a main.
  workflow_run:
    workflows: ["Generate Voice Assets"]
    types: [completed]
  workflow_dispatch:

# Un build por rama, y siempre el ÚLTIMO. Sin esto, cada push encola un build
# completo (npm ci + 9 gates + typecheck + NDK + prebuild + Gradle) y varios
# empujones seguidos saturan la cola: los runs lanzados a mano desde el botón
# "Run workflow" quedan esperando detrás y parece que no se genera nada.
# `cancel-in-progress` descarta el build en curso cuando llega un commit más
# nuevo a la misma rama, que es el que interesa de todos modos.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# `actions: write` es lo único que se añade sobre el permiso de lectura, y es
# para PODER BORRAR artefactos viejos al final del job (ver "Retirar artefactos").
# Sin este bloque el token hereda los permisos por defecto del repositorio.
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Evita el build duplicado: los push a ramas del propio repo ya compilan por
    # el evento `push`; el evento `pull_request` solo aporta valor para forks.
    # En `workflow_run` solo se recompila si la síntesis terminó bien (si falló,
    # no hay assets nuevos que empaquetar y el build seguiría igual de rojo).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')

    env:
      HAS_SIGNING_SECRETS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
      # Firebase (ver cabecera). projectId y sender id son públicos; la apiKey
      # y el appId salen de secrets para no dejarlos escritos en el repo.
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: valeria-b500f
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '477839657795'
      # Rama efectiva: en `workflow_run`, github.ref apunta a la rama por
      # defecto, no a la que se sintetizó. Se resuelve una sola vez aquí para
      # que el checkout y la condición del AAB usen ambos el mismo valor.
      TARGET_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      # Cuántas copias de CADA artefacto (android-apk, android-aab) sobreviven a
      # este build. Es lo que fija el suelo de almacenamiento del repositorio:
      #   1 → ~290 MB   2 → ~570 MB   3 → ~860 MB
      # En repositorio PÚBLICO el almacenamiento es gratis y esto da igual; en
      # PRIVADO la cuota es 500 MB (Free), 1 GB (Pro), 2 GB (Team) para TODA la
      # cuenta. Con 2 quedan el build actual y el anterior, que es el mínimo para
      # poder volver atrás si el último sale malo. Bájalo a 1 si la cuenta está
      # en el plan Free.
      KEEP_ARTIFACTS_PER_NAME: 2

    steps:
      # En `workflow_run` hay que pedir la RAMA, no el head_sha del run que nos
      # despierta: ese sha es el anterior a la síntesis y no trae los assets.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}

      # El APK compila igual sin estos secrets, pero sale sin acceso a Firebase
      # (la app arranca y avisa de config incompleta en Acceso Profesional).
      # El warning lo deja visible en el resumen del run para no descubrirlo
      # ya con el APK instalado en el dispositivo.
      - name: Avisar si faltan los secrets de Firebase
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ] || [ -z "$EXPO_PUBLIC_FIREBASE_APP_ID" ]; then
            echo "::warning title=Firebase sin configurar::Faltan los secrets EXPO_PUBLIC_FIREBASE_API_KEY / EXPO_PUBLIC_FIREBASE_APP_ID; este APK saldrá sin acceso a Firebase (ver docs/firebase-setup.md)."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate de cobertura del corpus de voz (plan de mejoras ACOPROS, fase 1):
      # falla si algún texto locutado en es/gl/eu no tiene su asset de voz
      # neuronal pregenerado. Antes de esto, un PR de texto podía mezclarse sin
      # regenerar el corpus ni sintetizar los assets sin que nada lo detectara
      # (la app cae a expo-speech en silencio, typecheck/tests/diff no lo ven).
      # Falla RÁPIDO, antes del build de Android. Ver docs/plan-mejoras-acopros-logopedas.json.
      - name: Comprobar cobertura del corpus de voz (es/gl/eu)
        run: node scripts/check-voice-corpus-coverage.js

      # Reglas de contenido acordadas con ACOPROS (ES-06, ES-10, ES-13). El
      # script existía desde la fase 3 pero nadie lo ejecutaba: el plan lo daba
      # por gate activo y en realidad solo protegía a quien se acordara de
      # lanzarlo a mano.
      - name: Comprobar reglas de contenido (ES-06, ES-10, ES-13)
        run: node scripts/check-content-rules.js

      # Programación de recordatorios por franjas (GEN-01). Cubre el caso que el
      # item marcaba como riesgo: apagar una franja debe CANCELAR sus avisos ya
      # en cola, no solo dejar de reprogramarlos.
      - name: Comprobar franjas de recordatorio (GEN-01)
        run: node scripts/check-reminder-slots.js

      # Cobertura de pictogramas en cápsulas de contraste (ES-12). Sin dibujo
      # propio por vuelta, la vuelta de comprensión enseña dos tarjetas
      # idénticas: la regla de congruencia de ES-13 obliga a que ambas muestren
      # el mismo objeto, y lo único que cambia es el atributo.
      - name: Comprobar pictogramas de contraste (ES-12)
        run: node scripts/check-pictogram-coverage.js

      # Progresión de dificultad de las categorías léxicas (ES-08). El orden de
      # escritura ES el orden de práctica: un ítem avanzado colado entre los
      # iniciales se le presenta al niño en su primera sesión.
      - name: Comprobar dificultad léxica (ES-08)
        run: node scripts/check-lexical-difficulty.js

      # Figuras de LSE en Academy (LSE-01). SignFigure devuelve null cuando la
      # clave no tiene dibujo —a propósito, para no romper la diapositiva—, así
      # que una clave equivocada no se ve ni en el diff ni en el typecheck:
      # simplemente desaparece el dibujo. Este gate comprueba que el abecedario
      # dactilológico está completo y que toda figura pedida existe.
      - name: Comprobar figuras de LSE (LSE-01)
        run: node scripts/check-sign-figures.js

      # Prosodia de la voz del SISTEMA (es-DO). La normalización de pausas
      # reescribe la puntuación de todo lo que locuta expo-speech: si una regla
      # se pasa de frenada y se come una palabra, no lo ve el diff ni el
      # typecheck — solo se oye, y ya en la tablet de una familia.
      - name: Comprobar prosodia de la voz del sistema (es-DO)
        run: node scripts/check-speech-prosody.js

      # Captura de corpus del ASR (Fase B · R7). No protege una función de la
      # app: protege de que una build que GRABA la voz de un niño llegue a
      # producción, o de que una grabación acabe versionada. Las dos cosas
      # pasan por descuido y ninguna la ve el typecheck ni el diff.
      # Ver docs/plan-asr-privacidad-y-motor-local.md §4.2.
      - name: Comprobar el candado de la captura de corpus (ASR Fase B)
        run: node scripts/check-asr-capture-guard.js

      # Opciones con las que se abre el micrófono. El módulo del ASR se carga
      # con require perezoso y queda tipado como `any`, así que lo que se le
      # pasa a start() no lo comprueba nadie: quitar el modelo de lenguaje de
      # palabra suelta compila, arranca y deja Pares Mínimos respondiendo «no te
      # escuché bien» en todos los ensayos. Ya ocurrió.
      - name: Comprobar las opciones de escucha del ASR
        run: node scripts/check-asr-listen-options.js

      - name: Comprobar la tabla de opcodes de Lúa
        run: node scripts/build-lua-protocol.js --check

      - name: Comprobar que Lúa sigue muda (sin audio, micro ni servos)
        run: node scripts/check-lua-mute.js

      # La migración de la mascota se dio por terminada tres veces a medias
      # (PNG, componente y texto locutado). Deja de ser una promesa.
      - name: Comprobar que la migración de la mascota está completa
        run: node scripts/check-brand-consistency.js

      # La UI se declaró migrada al catálogo con ficheros enteros todavía en
      # castellano (ValeriaVoiceUI, ValeriaManualNoiseSlider): compilan, el
      # typecheck pasa y la app sale mitad en inglés. Esto lo cierra.
      - name: Comprobar que la interfaz se lee del catálogo (EN-2.8)
        run: node scripts/check-ui-strings.js

      # Hermano del anterior para el contenido que NO es literal de pantalla:
      # los catálogos de ejercicios y de Academy se elegían con
      # `lang === 'en' ? EN : ES`, así que al entrar el catalán el adulto leía
      # castellano bajo una cabecera catalana — sin romper el typecheck y sin
      # que ningún gate lo viera. O hay rama catalana, o el hueco está
      # declarado en src/i18n/uiLangFallback.ts y la pantalla lo dice.
      - name: Comprobar que ningún idioma de interfaz cae en silencio (CA-2.9)
        run: node scripts/check-ui-lang-fallback.js

      # Suite adversarial de la integración catalana: paridad 1:1 del catálogo,
      # transiciones del selector y ejecución de las 200+ interpolaciones.
      # Existía desde la primera tanda pero no la corría nadie.
      - name: Suite de integración del catalán (ca)
        run: node scripts/test-challenger-final-ca-integration.js

      # La regla de "¿dijo esta palabra?" llegó a estar escrita dos veces, y no
      # eran iguales: las láminas de la frase podían encenderse enteras y el
      # veredicto decir «casi» en el mismo ensayo.
      - name: Comprobar que la lámina y el veredicto cuentan igual
        run: node scripts/check-word-coverage.js

      # La gata de la tableta aprendió a ronronear, a comer y a llevar puesta
      # una flor; la del aparato responde al dedo desde la V2. Ninguna de las
      # dos sabía nada de la otra, y con la misma cara eso no se nota.
      - name: Comprobar que la mascota es la misma en la tableta y en el aparato
        run: node scripts/check-lua-mascot-mirror.js

      # Aventuras con Lúa entró con cuatro defectos que ningún otro gate mira:
      # ni un dibujo en las pantallas (un niño de 0-2 tenía que LEER para
      # responder), la pauta del terapeuta locutada al niño al fallar, 378
      # locuciones fuera del corpus —que no rompen: caen a la voz del sistema— e
      # «Imprime y Juega» sin nada que imprimir. El módulo traía su propio
      # verificador y no estaba enchufado a ningún workflow, así que no corría.
      - name: Verificar Aventuras con Lúa (fichas, locución e imprimibles)
        run: node scripts/verify-aventuras-lua.js

      # Un ejercicio mezcla dos audiencias: el niño lee/oye la variedad de
      # terapia, el adulto lee la interfaz. Se contradecían dentro de la misma
      # pantalla —lista en inglés, escala EPT-3 en castellano— y lo encontró
      # Frank usando la app, no el typecheck.
      - name: Comprobar que cada audiencia lee su idioma
        run: node scripts/check-adult-fields.js

      # "La voz inglesa lee castellano": un selector por variedad escrito cuando
      # solo existían gl y eu, al que nadie añadió el inglés. No lo ve el
      # typecheck ni el corpus de voz —que enumera los bancos, no lo que la
      # pantalla elige—: solo se oye, y llegó como queja.
      - name: Comprobar que ninguna variedad se queda sin rama
        run: node scripts/check-variety-branches.js

      # El módulo sensorial llegó con catálogo, vúmetro, el rótulo "Sonido en
      # reproducción" y CERO audio: `audioAssetKey` estaba declarado en los once
      # estímulos y no lo consumía nadie. El typecheck no ve el silencio y las
      # capturas tampoco. Esto comprueba que los WAV existen, que son los del
      # catálogo y que suenan a lo que dice su ficha.
      - name: Comprobar que el módulo sensorial suena
        run: node scripts/check-sensory-assets.js

      # Las URLs legales que Play Console tiene declaradas salen de `site/`. Un
      # fichero renombrado allí no rompe nada compilando, pero deja la ficha con
      # un 404 y la publicación parada. Aquí va la mitad LOCAL del gate; la que
      # pide las URLs de verdad vive en `legal-urls.yml`, porque el build no
      # debe depender de la red.
      - name: Comprobar las páginas legales declaradas en Play Console
        run: node scripts/check-legal-urls.js --offline

      # Play bloqueó la app el 1/9/2026 por FOREGROUND_SERVICE_MEDIA_PLAYBACK,
      # que nadie declaró: lo trae el manifiesto de expo-audio y el fusionador
      # lo mete en el APK. Lo retira `plugins/withValeriaNoBackgroundAudio.js`,
      # y esto vigila que siga retirado —también cuando expo-audio suba de
      # versión y traiga un servicio más.
      - name: Comprobar que el APK no pide servicios en primer plano
        run: node scripts/check-no-background-audio.js

      # Los ejercicios de RA miden magnitudes que acaban en el panel de la
      # logopeda y, en nivel A, en el conjunto publicable. Estas dos suites son
      # reimplementaciones en JS de las fórmulas del Kotlin —no compilan el
      # ejercicio real—, y por eso incluyen un anclaje que lee los fuentes y
      # falla si las constantes se separan. Nacieron pasando 20/20 sin estar
      # cableadas a nada mientras AR-5 registraba un tiempo de reacción de 320 ms
      # constante: pasar sin que nadie te ejecute no es pasar.
      - name: Comprobar la aritmética clínica de los ejercicios de RA
        run: node scripts/verify-ar-clinical-math.js

      - name: Comprobar las defensas adversarias de los ejercicios de RA
        run: node scripts/stress-test-ar-adversarial.js

      # Este NO reimplementa nada: lee los .kt y afirma sobre ellos. Cubre lo
      # que Gradle no distingue —compilar no es estar libre de carreras— y lo
      # hace en segundos en vez de en veinte minutos. Las invariantes son las
      # tres que ya costaron caro: el AudioTrack con un solo hilo dueño, los
      # plazos del ensayo compensados al volver de segundo plano, y la ventana
      # de respuesta de AR-2 anclada al tono y no a la petición del tono.
      - name: Comprobar la concurrencia y el ciclo de vida de RA
        run: node scripts/check-ar-concurrency.js

      # El gate de arriba solo lee Kotlin, y la mitad del fallo del Pixel 6a
      # (2/9/2026) vivía en TypeScript: el nativo devolvía un objeto de error
      # donde se esperaba un perfil y la pantalla lo dio por bueno. El typecheck
      # no lo vio porque el tipo declarado era una promesa que el puente no
      # podía cumplir. Esto vigila lo que un typecheck no puede: que la forma
      # declarada sea la que el nativo manda, y que los motivos de fallo no se
      # separen entre los dos idiomas.
      - name: Comprobar el contrato del puente de RA
        run: node scripts/check-ar-bridge-contract.js

      # Los .glb los genera `scripts/build-ar-models.js` y los declara el enum
      # ArModel. Un modelo declarado sin fichero deja la escena vacía en el
      # teléfono y no rompe ninguna compilación.
      - name: Comprobar el contrato de assets 3D de RA
        run: node scripts/check-ar-models.js

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle descarga el NDK en mitad del build y esa descarga a veces llega
      # corrupta ("Archive is not a ZIP archive"). Instalarlo aquí con
      # reintentos elimina ese punto de fallo intermitente.
      # La versión debe coincidir con la que pide React Native (0.81 → NDK 27,
      # ver node_modules/react-native/ReactAndroid/gradle.properties).
      - name: Install Android NDK 27.1.12297006 (with retries)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ok=0
          for i in 1 2 3; do
            if echo y | "$SDKMANAGER" --install "ndk;27.1.12297006"; then
              echo "NDK instalado en el intento $i"
              ok=1
              break
            fi
            echo "Descarga del NDK fallida (intento $i); limpiando restos y reintentando…"
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "No se pudo instalar el NDK tras 3 intentos"
            exit 1
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Play Console exige que cada subida tenga un versionCode mayor que la
      # anterior. El prebuild lo genera fijo en 1, así que lo derivamos del
      # número de run del workflow, que GitHub incrementa en cada ejecución.
      - name: Set versionCode from workflow run number
        run: |
          sed -i "s/versionCode 1\b/versionCode ${{ github.run_number }}/" android/app/build.gradle
          if ! grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle; then
            echo "No se encontró 'versionCode 1' en build.gradle; la plantilla del prebuild puede haber cambiado"
            exit 1
          fi
          grep -E "versionCode|versionName" android/app/build.gradle

      # La plantilla del prebuild deja el daemon de Gradle en 2 GiB de heap y 512
      # MiB de metaspace, y este proyecto no cabe ahí: TODOS los builds —también
      # los verdes— avisan de "Daemon will be stopped at the end of the build
      # after running out of JVM Metaspace". El 20/8/2026 el run 561 murió en
      # :app:packageRelease con el MISMO commit (ff05ef7) que había compilado
      # verde dos veces la tarde anterior, runs 559 y 560. Un fallo que aparece y
      # desaparece sin tocar el código es lo que hace un build al límite.
      # Gradle lee gradle.properties como java.util.Properties: la última
      # definición de una clave gana, así que basta con añadir la nuestra al
      # final y la plantilla puede cambiar sin romper esto.
      - name: Dar memoria al daemon de Gradle
        run: |
          test -f android/gradle.properties
          cat >> android/gradle.properties <<'PROPS'

          # Sobrescribe el valor de la plantilla del prebuild (ver android.yml).
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          PROPS
          grep -n '^org.gradle.jvmargs' android/gradle.properties

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./android/gradlew

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Add release signingConfig to build.gradle
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          python3 - <<'PY'
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          release_signing_config = """        release {
              storeFile file("release.keystore")
              storePassword System.getenv("RELEASE_STORE_PASSWORD")
              keyAlias System.getenv("RELEASE_KEY_ALIAS")
              keyPassword System.getenv("RELEASE_KEY_PASSWORD")
          }
          """
          content = content.replace(
              "    signingConfigs {\n        debug {",
              "    signingConfigs {\n" + release_signing_config + "        debug {",
              1,
          )

          old_release_block = (
              "        release {\n"
              "            // Caution! In production, you need to generate your own keystore file.\n"
              "            // see https://reactnative.dev/docs/signed-apk-android.\n"
              "            signingConfig signingConfigs.debug\n"
          )
          new_release_block = (
              "        release {\n"
              "            signingConfig signingConfigs.release\n"
          )
          assert old_release_block in content, "release buildType block not found - build.gradle template may have changed"
          content = content.replace(old_release_block, new_release_block, 1)

          with open(path, "w") as f:
              f.write(content)
          PY

      # El APK es para instalar a mano en dispositivos reales (siempre ARM):
      # se limita a armeabi-v7a + arm64-v8a, igual que el perfil "apk" de
      # eas.json. Sin el filtro, el prebuild compila también x86/x86_64 (solo
      # útiles en emuladores) y el APK universal sale el doble de pesado, con
      # instalaciones larguísimas en el dispositivo. El AAB de Play no lo
      # necesita: Play ya entrega a cada dispositivo solo su arquitectura.
      - name: Build signed release APK
        if: env.HAS_SIGNING_SECRETS == 'true'
        working-directory: ./android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --stacktrace

      # El AAB es el formato que exige Google Play. Solo se genera en main (cada
      # fusión) o al lanzar el workflow a mano, para no alargar los builds de PR.
      - name: Build signed release AAB
        if: env.HAS_SIGNING_SECRETS == 'true' && (env.TARGET_BRANCH == 'main' || github.event_name == 'workflow_dispatch')
        working-directory: ./android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      # `retention-days` recorta la retención del repositorio (7 días) SOLO hacia
      # abajo. El AAB se sube a Play Console el mismo día que se compila; a los 3
      # días ya no lo quiere nadie y son 156 MB ocupados.
      - name: Upload AAB
        if: env.HAS_SIGNING_SECRETS == 'true' && (env.TARGET_BRANCH == 'main' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_SIGNING_SECRETS != 'true'
        working-directory: ./android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --stacktrace

      # Cuando Gradle muere dentro de un worker (el caso del run 561), el log no
      # dice si fue la memoria o el disco. Estas dos líneas lo dicen, y solo
      # cuestan algo en los builds que ya han fallado.
      - name: Qué había en la máquina cuando falló
        if: failure()
        run: |
          df -h
          free -m

      # El APK son 131 MB y en las ramas `claude/**` no se instala en ningún
      # sitio: la regla de trabajo es que nada llega a Frank hasta estar en main
      # con build verde, así que ese APK nacía muerto y ocupaba lo mismo. En la
      # ventana medida (10-15 ago) fueron 10 de 18 builds con éxito, ~1,3 GB
      # tirados. La rama SIGUE COMPILANDO —los gates y Gradle corren igual, que
      # es para lo que sirve—; lo único que se pierde es el fichero.
      # Para bajarse el APK de una rama: pestaña Actions → "Android Build" →
      # botón "Run workflow" eligiendo esa rama. Ese `workflow_dispatch` sí sube.
      - name: Upload APK
        if: env.TARGET_BRANCH == 'main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 5

      # La retención sola no basta: entre dos barridos se acumulan todos los
      # builds de la ventana (con 7 días eran ~4,6 GB vivos, medidos por API el
      # 15/8/2026). Esto deja el almacenamiento en un suelo FIJO —KEEP copias de
      # cada nombre— en vez de en algo que crece con el ritmo de commits.
      # `always()`: también limpia si el build falló, que es cuando más falta
      # hace no dejar basura detrás.
      - name: Retirar artefactos de builds anteriores
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.name, .created_at, .id, .size_in_bytes] | @tsv' \
            > all.tsv || { echo "::warning::No se pudo listar artefactos; se salta la limpieza."; exit 0; }

          # Orden: por nombre, y dentro de cada nombre del más nuevo al más
          # viejo. Los KEEP primeros de cada nombre se quedan; el resto, fuera.
          sort -k1,1 -k2,2r all.tsv \
            | awk -v keep="$KEEP_ARTIFACTS_PER_NAME" \
                '{ n[$1]++; print (n[$1] <= keep ? "VIVO" : "SOBRA"), $0 }' > clasificados.tsv
          sed -n 's/^VIVO //p'  clasificados.tsv > vivos.tsv
          sed -n 's/^SOBRA //p' clasificados.tsv > sobran.tsv

          freed=0
          borrados=0
          while IFS=$'\t' read -r name created id size; do
            [ -z "$id" ] && continue
            if gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" --silent; then
              freed=$((freed + size))
              borrados=$((borrados + 1))
              echo "borrado $name ($id · $size B · $created)"
            else
              echo "::warning::No se pudo borrar el artefacto $id ($name)."
            fi
          done < sobran.tsv

          {
            echo "### Almacenamiento de artefactos"
            echo "Se conservan **$KEEP_ARTIFACTS_PER_NAME** copias de cada artefacto."
            echo ""
            echo "Borrados: **$borrados** · Liberado: **$((freed / 1000000)) MB**"
            echo ""
            echo "| Artefacto | Copias vivas | MB |"
            echo "| --- | ---: | ---: |"
            awk -F'\t' '{ s[$1] += $4; n[$1]++ }
              END { for (k in s) printf "| %s | %d | %d |\n", k, n[k], s[k]/1000000 }' vivos.tsv
          } >> "$GITHUB_STEP_SUMMARY"
